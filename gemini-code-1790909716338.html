<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World - 多國語言版</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f8fafc;
            color: #1e293b;
            margin: 0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { max-width: 860px; width: 100%; text-align: center; }
        h1 { font-size: 2.2rem; margin-bottom: 8px; color: #0f172a; }
        p.desc { color: #64748b; margin-bottom: 20px; }
        .display-box {
            background: #fff;
            border-radius: 14px;
            padding: 30px 20px;
            margin-bottom: 24px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            border: 1px solid #e2e8f0;
        }
        .display-greeting {
            font-size: 2.8rem;
            font-weight: 700;
            color: #4f46e5;
            margin-bottom: 8px;
        }
        .display-info { color: #64748b; font-size: 1.1rem; }
        .search-box {
            width: 100%;
            max-width: 360px;
            padding: 10px 14px;
            font-size: 1rem;
            border: 1px solid #cbd5e1;
            border-radius: 20px;
            margin-bottom: 24px;
            outline: none;
        }
        .search-box:focus { border-color: #4f46e5; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 14px;
        }
        .card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 14px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
        }
        .card:hover { transform: translateY(-3px); border-color: #4f46e5; }
        .card.active { border-color: #4f46e5; background: #eef2ff; }
        .card-header { font-size: 1rem; font-weight: 600; margin-bottom: 6px; }
        .card-text { font-size: 1.15rem; font-weight: bold; color: #1e293b; margin-bottom: 4px; }
        .card-rom { font-size: 0.85rem; color: #64748b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>多國語言 Hello World</h1>
        <p class="desc">點擊下方卡片切換不同語言版本</p>
        <div class="display-box">
            <div class="display-greeting" id="greeting">你好，世界！</div>
            <div class="display-info" id="info">🇹🇼 繁體中文 (Traditional Chinese)</div>
        </div>
        <input type="text" id="search" class="search-box" placeholder="搜尋語言..." oninput="filterLangs()">
        <div class="grid" id="grid"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
